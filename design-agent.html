<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaView · Design Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            border: "hsl(240 5.9% 90%)",
            background: "hsl(240 4.8% 95.9%)",
            foreground: "hsl(240 10% 3.9%)",
            card: "hsl(0 0% 100%)",
            muted: "hsl(240 4.8% 95.9%)",
            "muted-foreground": "hsl(240 5% 28%)",
          },
          borderRadius: {
            sm: "calc(0.625rem - 4px)",
            md: "calc(0.625rem - 2px)",
            lg: "0.625rem",
            xl: "calc(0.625rem + 4px)",
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background: hsl(240 4.8% 95.9%); }
  </style>
</head>
<body class="text-foreground">
  <div class="flex min-h-screen bg-background text-foreground">
    <!-- Sidebar -->
    <aside class="flex w-64 shrink-0 flex-col border-r border-border bg-card">
      <div class="flex items-center justify-between px-5 py-4">
        <div class="flex items-center gap-2">
          <i data-lucide="users" class="h-6 w-6 text-[#003AB8]"></i>
          <span class="text-xl font-bold text-[#003AB8]">instaview</span>
        </div>
        <i data-lucide="panel-left-close" class="h-5 w-5 text-muted-foreground"></i>
      </div>

      <div class="border-t border-[hsl(240_6%_80%)]"></div>

      <div class="px-4 py-3">
        <p class="mb-1 text-xs text-muted-foreground">Aktuálna firma</p>
        <button class="flex w-full items-center justify-between rounded-md border border-border bg-card px-3 py-2 text-sm shadow-sm">
          <span class="flex items-center gap-2">
            <span class="flex h-6 w-6 items-center justify-center rounded bg-[#003AB8]/20 text-xs font-semibold text-[#003AB8]">TE</span>
            Testovanie 2
          </span>
          <i data-lucide="chevrons-up-down" class="h-4 w-4 text-muted-foreground"></i>
        </button>
      </div>

      <div class="border-t border-[hsl(240_6%_80%)]"></div>

      <div class="px-4 py-4">
        <div class="flex items-center justify-between rounded-lg border border-[#003AB8]/30 bg-[#003AB8]/10 px-3 py-2.5">
          <div class="flex items-center gap-2">
            <i data-lucide="sparkles" class="h-4 w-4 text-[#003AB8]"></i>
            <div class="leading-tight">
              <p class="text-xs text-muted-foreground">AI kredity</p>
              <p class="text-sm font-semibold">188.48</p>
            </div>
          </div>
          <span class="rounded-md bg-[#003AB8] px-2.5 py-0.5 text-xs font-semibold text-white">Kúpiť</span>
        </div>
      </div>

      <div class="border-t border-[hsl(240_6%_80%)]"></div>

      <nav class="flex-1 space-y-1 px-3 py-3" id="mainNav"></nav>

      <div class="border-t border-[hsl(240_6%_80%)]"></div>

      <div class="space-y-1 px-3 py-3" id="bottomNav"></div>

      <div class="border-t border-[hsl(240_6%_80%)]"></div>

      <div class="space-y-1 px-3 py-3">
        <button class="flex w-full items-center justify-between rounded-md bg-muted px-3 py-2 text-sm">
          <span class="flex items-center gap-2">🇸🇰 SK</span>
          <i data-lucide="chevrons-up-down" class="h-4 w-4 text-muted-foreground"></i>
        </button>
        <button class="flex w-full items-center justify-between rounded-md px-3 py-2 text-sm">
          <span class="flex items-center gap-2">
            <span class="flex h-7 w-7 items-center justify-center rounded-full bg-muted text-xs font-semibold">L</span>
            Luboš Repka
          </span>
          <i data-lucide="chevrons-up-down" class="h-4 w-4 text-muted-foreground"></i>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex flex-1 items-center justify-center overflow-y-auto px-8 py-10">
      <div class="w-full max-w-3xl">
        <div class="text-center">
          <h1 class="text-3xl font-bold">Vytvoriť nového agenta</h1>
          <p class="mt-2 text-muted-foreground">Ako chcete začať?</p>
        </div>

        <div class="mx-auto mt-10 grid grid-cols-1 gap-5 sm:grid-cols-2">
          <button onclick="location.href='agent-builder.html'" class="group flex flex-col items-start gap-4 rounded-xl border border-border bg-card p-7 text-left shadow-sm transition-all hover:border-[#003AB8] hover:shadow-md">
            <span class="flex h-12 w-12 items-center justify-center rounded-lg bg-[#003AB8]/10 text-[#003AB8]">
              <i data-lucide="pencil-ruler" class="h-6 w-6"></i>
            </span>
            <span class="text-lg font-semibold">Navrhnúť vlastného</span>
            <span class="text-sm text-muted-foreground">Zostavte si vlastný konverzačný scenár od nuly — správy, vetvenie, otázky, pravidlá správania a analytiku.</span>
          </button>
          <button onclick="location.href='call-template.html'" class="group flex flex-col items-start gap-4 rounded-xl border border-border bg-card p-7 text-left shadow-sm transition-all hover:border-[#003AB8] hover:shadow-md">
            <span class="flex h-12 w-12 items-center justify-center rounded-lg bg-[#003AB8]/10 text-[#003AB8]">
              <i data-lucide="layout-template" class="h-6 w-6"></i>
            </span>
            <span class="text-lg font-semibold">Začať zo šablóny</span>
            <span class="text-sm text-muted-foreground">Použite predpripraveného agenta (overovanie, oslovenie, jazykový test a ďalšie) a upravte si ho.</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const navItems = [
      { label: "Prehľad", icon: "layout-grid", href: "dashboard-preview.html" },
      { label: "Pohovory", icon: "message-square" },
      { label: "Pracovné pozície", icon: "briefcase" },
      { label: "Kandidáti", icon: "clipboard-list" },
      { label: "Vyhľadávanie talentov", icon: "search", href: "instaview-sourcing-agent.html" },
      { label: "Agenti", icon: "bot", href: "agents-preview.html" },
      { label: "Design agent", icon: "sparkles", href: "design-agent.html", active: true },
    ];
    const bottomNav = [
      { label: "Fakturácia a spotreba", icon: "credit-card" },
      { label: "Nastavenia", icon: "settings" },
      { label: "Podpora", icon: "help-circle" },
    ];

    document.getElementById("mainNav").innerHTML = navItems.map(i => {
      const cls = `flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors ${i.active ? "bg-[#003AB8]/15 text-[#003AB8]" : "text-foreground hover:bg-muted"}`;
      const inner = `<i data-lucide="${i.icon}" class="h-4 w-4"></i>${i.label}`;
      return i.href
        ? `<a href="${i.href}" class="${cls}">${inner}</a>`
        : `<button class="${cls}">${inner}</button>`;
    }).join("");

    document.getElementById("bottomNav").innerHTML = bottomNav.map(i => `
      <button class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-muted hover:text-foreground">
        <i data-lucide="${i.icon}" class="h-4 w-4"></i>${i.label}
      </button>`).join("");

    lucide.createIcons();
  </script>
</body>
</html>
