<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TalentBoard · Hodnotenie kandidátov</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #fbfcfe;
    --border: #e7eaf3;
    --border-strong: #d6dbeb;
    --text: #1a1f36;
    --text-soft: #5b647e;
    --text-muted: #9aa3bd;
    --brand: #4f46e5;
    --brand-soft: #eef0ff;
    --green: #16a34a;
    --green-soft: #e7f7ed;
    --amber: #d97706;
    --amber-soft: #fdf3e3;
    --red: #dc2626;
    --shadow-sm: 0 1px 2px rgba(26,31,54,.06), 0 1px 3px rgba(26,31,54,.05);
    --shadow-md: 0 4px 14px rgba(26,31,54,.08);
    --shadow-lg: 0 14px 40px rgba(26,31,54,.16);
    --radius: 18px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 18px;
    box-shadow: var(--shadow-md);
  }
  .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  .brand p { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }

  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .position-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    color: var(--text-soft);
  }
  .position-pill strong { color: var(--text); font-weight: 600; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 13px;
  }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    padding: 26px 32px 40px;
    align-items: start;
  }

  .column {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 16px 14px 14px;
    transition: background .18s, border-color .18s, box-shadow .18s;
    min-height: 480px;
  }
  .column.recommended {
    background: linear-gradient(180deg, #f3f4ff 0%, #fbfcfe 70%);
    border-color: #d9dbff;
  }
  .column.drag-over {
    background: var(--brand-soft);
    border-color: var(--brand);
    box-shadow: inset 0 0 0 2px rgba(79,70,229,.18);
  }

  .col-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px 14px;
  }
  .col-title { display: flex; align-items: center; gap: 9px; }
  .col-dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot-all { background: #6366f1; }
  .dot-rejected { background: #94a3b8; }
  .dot-reco { background: var(--green); }
  .col-title h2 { font-size: 14.5px; font-weight: 700; letter-spacing: -.1px; }
  .count {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-size: 12px; font-weight: 600;
    min-width: 24px; text-align: center;
    padding: 2px 8px; border-radius: 999px;
  }

  .col-list { display: flex; flex-direction: column; gap: 12px; min-height: 60px; }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 16px 14px;
    box-shadow: var(--shadow-sm);
    cursor: grab;
    transition: box-shadow .18s, transform .12s, border-color .18s, opacity .18s;
    position: relative;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: var(--border-strong); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .45; box-shadow: var(--shadow-lg); transform: scale(.99) rotate(-.4deg); }
  .column.recommended .card { border-color: #e0e1ff; }

  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .c-avatar {
    width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center; color: #fff;
    font-weight: 600; font-size: 15px; flex-shrink: 0;
  }
  .c-id { flex: 1; min-width: 0; }
  .c-name { font-size: 14.5px; font-weight: 700; letter-spacing: -.1px; }
  .c-role { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }

  .match {
    text-align: right; flex-shrink: 0;
  }
  .match-val { font-size: 16px; font-weight: 800; line-height: 1; }
  .match-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }
  .m-high { color: var(--green); }
  .m-mid { color: var(--amber); }
  .m-low { color: var(--text-muted); }

  .summary {
    font-size: 12.7px; color: var(--text-soft); line-height: 1.5;
    margin: 11px 0 12px;
  }

  /* progress bar */
  .bar { height: 7px; border-radius: 999px; background: #eef0f6; overflow: hidden; margin-bottom: 13px; }
  .bar > i { display: block; height: 100%; border-radius: 999px; }
  .fill-high { background: linear-gradient(90deg, #22c55e, #16a34a); }
  .fill-mid  { background: linear-gradient(90deg, #fbbf24, #d97706); }
  .fill-low  { background: linear-gradient(90deg, #cbd5e1, #94a3b8); }

  /* skills */
  .skills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600;
    padding: 4.5px 10px; border-radius: 999px;
    border: 1px solid transparent;
  }
  .pill.met {
    background: var(--green-soft); color: #15803d; border-color: #c7ecd3;
  }
  .pill.met::before { content: "✓"; font-size: 10px; }
  .pill.missing {
    background: #f4f5f9; color: var(--text-muted); border-color: var(--border);
  }
  .pill.missing::before { content: "○"; font-size: 9px; }

  .req-note {
    margin-top: 11px; padding-top: 11px; border-top: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px; color: var(--text-soft);
  }
  .req-note b { color: var(--text); }

  .empty {
    border: 2px dashed var(--border-strong);
    border-radius: var(--radius);
    padding: 28px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12.5px;
  }

  @media (max-width: 980px) {
    .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">T</div>
      <div>
        <h1>TalentBoard</h1>
        <p>Hodnotenie kandidátov</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="position-pill">
        Pozícia: <strong>Senior Frontend Developer</strong>
      </div>
      <div class="avatar">LR</div>
    </div>
  </header>

  <main class="board" id="board">
    <!-- columns injected by JS -->
  </main>

<script>
const REQUIRED = ["React", "TypeScript", "CSS", "Testing", "Node.js"];

const candidates = [
  {
    id: "c1", name: "Mária Kováčová", role: "Frontend Engineer · 6 r.",
    match: 94, color: "#4f46e5",
    summary: "Senior FE inžinierka so silným zázemím v React ekosystéme, viedla redesign produktu pre 200k používateľov.",
    skills: ["React", "TypeScript", "CSS", "Testing", "Node.js", "GraphQL"],
    status: "reco"
  },
  {
    id: "c2", name: "Tomáš Novák", role: "UI Developer · 4 r.",
    match: 88, color: "#0ea5e9",
    summary: "Špecialista na výkon a prístupnosť, dôraz na čistý design systém a komponentové knižnice.",
    skills: ["React", "TypeScript", "CSS", "Figma"],
    status: "reco"
  },
  {
    id: "c3", name: "Jana Horváthová", role: "Fullstack Developer · 5 r.",
    match: 81, color: "#16a34a",
    summary: "Fullstack profil s presahom do backendu, skúsenosti s budovaním škálovateľných SPA aplikácií.",
    skills: ["React", "Node.js", "CSS", "PostgreSQL"],
    status: "all"
  },
  {
    id: "c4", name: "Peter Baláž", role: "Frontend Developer · 3 r.",
    match: 73, color: "#d97706",
    summary: "Solídne základy, rastúci junior-to-mid profil, motivovaný učiť sa testovanie a TypeScript.",
    skills: ["React", "CSS", "Testing"],
    status: "all"
  },
  {
    id: "c5", name: "Lucia Tóthová", role: "Web Developer · 7 r.",
    match: 68, color: "#db2777",
    summary: "Skúsená web developerka s prevahou vo Vue, prechod na React v poslednom roku.",
    skills: ["CSS", "Testing", "JavaScript"],
    status: "all"
  },
  {
    id: "c6", name: "Martin Šimko", role: "Junior Developer · 1 r.",
    match: 52, color: "#64748b",
    summary: "Junior bez komerčných React skúseností, portfólio z osobných projektov a bootcampu.",
    skills: ["CSS", "JavaScript"],
    status: "rejected"
  },
  {
    id: "c7", name: "Eva Krajčová", role: "Designer / Dev · 4 r.",
    match: 61, color: "#9333ea",
    summary: "Hybridný design+dev profil, výborná na UI, slabšie pokrytie testovania a TS.",
    skills: ["CSS", "Figma", "React"],
    status: "rejected"
  }
];

const COLUMNS = [
  { key: "all",      title: "Všetci kandidáti", dot: "dot-all" },
  { key: "rejected", title: "Neprijatí",        dot: "dot-rejected" },
  { key: "reco",     title: "Odporúčaní",       dot: "dot-reco", reco: true }
];

const matchClass = m => m >= 80 ? "high" : m >= 65 ? "mid" : "low";

function cardHTML(c) {
  const mc = matchClass(c.match);
  const skills = REQUIRED.map(req => {
    const met = c.skills.includes(req);
    return `<span class="pill ${met ? "met" : "missing"}">${req}</span>`;
  }).join("");
  const extra = c.skills.filter(s => !REQUIRED.includes(s))
    .map(s => `<span class="pill missing">${s}</span>`).join("");
  const metCount = REQUIRED.filter(r => c.skills.includes(r)).length;

  return `
  <article class="card" draggable="true" data-id="${c.id}">
    <div class="card-top">
      <div class="c-avatar" style="background:${c.color}">${initials(c.name)}</div>
      <div class="c-id">
        <div class="c-name">${c.name}</div>
        <div class="c-role">${c.role}</div>
      </div>
      <div class="match">
        <div class="match-val m-${mc}">${c.match}%</div>
        <div class="match-label">zhoda</div>
      </div>
    </div>
    <p class="summary">${c.summary}</p>
    <div class="bar"><i class="fill-${mc}" style="width:${c.match}%"></i></div>
    <div class="skills">${skills}${extra}</div>
    <div class="req-note">
      <span>Spĺňa požiadavky</span>
      <span><b>${metCount}/${REQUIRED.length}</b> kľúčových skills</span>
    </div>
  </article>`;
}

function initials(name) {
  return name.split(" ").map(w => w[0]).slice(0,2).join("").toUpperCase();
}

function render() {
  const board = document.getElementById("board");
  board.innerHTML = COLUMNS.map(col => {
    const list = candidates
      .filter(c => c.status === col.key)
      .sort((a,b) => b.match - a.match);
    const cards = list.length
      ? list.map(cardHTML).join("")
      : `<div class="empty">Sem presuňte kandidátov</div>`;
    return `
    <section class="column ${col.reco ? "recommended" : ""}" data-status="${col.key}">
      <div class="col-head">
        <div class="col-title">
          <span class="col-dot ${col.dot}"></span>
          <h2>${col.title}</h2>
        </div>
        <span class="count">${list.length}</span>
      </div>
      <div class="col-list">${cards}</div>
    </section>`;
  }).join("");
  bindDnD();
}

/* ---------- Drag & Drop ---------- */
let draggedId = null;

function bindDnD() {
  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("dragstart", e => {
      draggedId = card.dataset.id;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      draggedId = null;
    });
  });

  document.querySelectorAll(".column").forEach(col => {
    col.addEventListener("dragover", e => {
      e.preventDefault();
      col.classList.add("drag-over");
    });
    col.addEventListener("dragleave", e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove("drag-over");
    });
    col.addEventListener("drop", e => {
      e.preventDefault();
      col.classList.remove("drag-over");
      const newStatus = col.dataset.status;
      const cand = candidates.find(c => c.id === draggedId);
      if (cand && cand.status !== newStatus) {
        cand.status = newStatus;
        render();
      }
    });
  });
}

render();
</script>
</body>
</html>
