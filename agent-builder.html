<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InstaView · Scénár editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: { border:"hsl(240 5.9% 90%)", background:"hsl(240 4.8% 95.9%)", foreground:"hsl(240 10% 3.9%)", card:"hsl(0 0% 100%)", muted:"hsl(240 4.8% 95.9%)", "muted-foreground":"hsl(240 5% 28%)" },
        borderRadius: { sm:"calc(0.625rem - 4px)", md:"calc(0.625rem - 2px)", lg:"0.625rem", xl:"calc(0.625rem + 4px)" },
      } },
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background:#fff; }
    #view-other { background:#f4f4f7; }
    #view-other .sec-card { background:#fff; border:1px solid #e8e8ef; border-radius:10px; box-shadow:0 1px 2px rgba(15,15,25,.03); }
    #view-other .bd-blue   { border-color:#c7d7f5; }
    #view-other .bd-indigo { border:1.5px solid #b9bff0; box-shadow:0 2px 10px rgba(79,70,229,.06); }
    #view-other .bd-teal   { border-color:#bfe6e0; }
    #view-other .bd-amber  { border-color:#f2ddb3; }
    #view-other .bd-rose   { border-color:#f2c7cf; }
    #view-other .sub-card { background:#fff; border:1px solid #ececf3; border-radius:8px; }
    #view-other .analytics-wrap > * + * { margin-top:24px; }
    #view-other .sec-inner-gap > * + * { margin-top:14px; }
    .canvas{ background-color:#fafafc; background-image:radial-gradient(circle,#dcdce2 1px,transparent 1px); background-size:22px 22px; }
    .fnode{ width:250px; background:#fff; border:1px solid #e6e6ee; border-radius:13px; box-shadow:0 1px 3px rgba(0,0,0,.06); padding:13px 15px; cursor:pointer; display:flex; gap:11px; align-items:flex-start; transition:border-color .15s, box-shadow .15s; }
    .fnode:hover{ border-color:#b9c4e6; }
    .fnode.sel{ border-color:#003AB8; box-shadow:0 0 0 2px rgba(0,58,184,.22); }
    .fnode .ic{ width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px; }
    .fnode .tt{ font-size:13.5px;font-weight:700;color:#15151c; }
    .fnode .sub{ font-size:11.5px;color:#8a8a93;margin-top:2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden; }
    .fconn{ width:1.5px;height:36px;background:#d5d5dd;position:relative;display:flex;align-items:center;justify-content:center; }
    .fconn .add{ width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid #d0d0d8;color:#8a8a93;display:grid;place-items:center;cursor:pointer; }
    .fconn .add:hover{ border-color:#003AB8;color:#003AB8; }
    .bstep{ display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:11px;cursor:pointer;transition:background .12s; }
    .bstep:hover{ background:hsl(240 4.8% 96.5%); }
    .bstep .ic{ width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none; }
    .zoombtn{ width:34px;height:30px;border:0;background:#fff;display:grid;place-items:center;color:#5f6368;cursor:pointer; }
    .zoombtn:hover{ background:hsl(240 4.8% 95.9%); }
    .addpop{ position:absolute;z-index:20;width:280px;background:#fff;border:1px solid #e6e6ee;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.16);padding:8px; }
    .addpop-h{ display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px;font-size:12px;font-weight:700;color:#7a7a82; }
    .addpop .opt{ display:flex;gap:11px;align-items:flex-start;padding:10px;border-radius:10px;cursor:pointer; }
    .addpop .opt:hover{ background:hsl(240 4.8% 96.5%); }
    .addpop .opt .ic{ width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px; }
    .addpop .opt .tt{ font-size:13px;font-weight:700;color:#15151c; }
    .addpop .opt .ds{ font-size:11.5px;color:#8a8a93;line-height:1.4;margin-top:2px; }
    .broutes{ display:flex;gap:18px;align-items:flex-start; }
    .broute{ display:flex;flex-direction:column;align-items:center;gap:8px; }
    .brlbl{ font-size:11px;font-weight:700;color:#5f6368; }
    .braddstep{ font-size:11.5px;font-weight:600;color:#003AB8;border:1px dashed #b9c4e6;border-radius:9px;padding:7px 12px;background:#fff;cursor:pointer;white-space:nowrap; }
    .braddstep:hover{ background:rgba(0,58,184,.04); }
    .cvar{ display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#003AB8;background:rgba(0,58,184,.06);border:1px solid rgba(0,58,184,.15);border-radius:7px;padding:5px 10px;cursor:pointer;font-family:ui-monospace,monospace; }
    .cvar:hover{ background:rgba(0,58,184,.1); }
    .switch{ position:relative;display:inline-flex;height:1.4rem;width:2.5rem;flex:none;cursor:pointer;align-items:center; }
    .switch input{ position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer; }
    .switch .track{ height:1.4rem;width:2.5rem;border-radius:9999px;background:#d1d5db;transition:background .2s; }
    .switch .thumb{ position:absolute;left:3px;height:1.05rem;width:1.05rem;border-radius:9999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s; }
    .switch input:checked + .track{ background:#22c55e; }
    .switch input:checked ~ .thumb{ transform:translateX(1.1rem); }
    .seg{ display:inline-flex;border:1px solid #d5d5de;border-radius:6px;overflow:hidden; }
    .seg button{ padding:5px 12px;font-size:12px;font-weight:600;background:#fff;color:#334155;border:0;cursor:pointer;transition:background .15s,color .15s; }
    .seg button.on-req{ background:#003AB8;color:#fff; }
    .seg button.on-pref{ background:#f4f4f7;color:#0f172a;box-shadow:inset 0 0 0 1px #cbd5e1; }
    #view-other button{ transition:transform .12s ease, box-shadow .15s ease, background-color .15s ease, color .15s ease, border-color .15s ease; }
    #view-other button:hover{ box-shadow:0 1px 3px rgba(15,15,25,.08); }
    #view-other button:active{ transform:scale(.96); }
    #view-other button.is-open{ background:#eef2ff; border-color:#c7d2fe; color:#003AB8; box-shadow:inset 0 0 0 1px #c7d2fe; }
    .seg button{ transition:background .15s, color .15s, box-shadow .15s !important; }
    .seg button:active{ transform:scale(.97); }
    .switch .thumb{ transition:transform .22s cubic-bezier(.4,.0,.2,1) !important; }
    .switch .track{ transition:background .22s ease !important; }
    .chip{ display:inline-flex;align-items:center;gap:4px;padding:5px 10px;font-size:12px;font-weight:600;border-radius:9999px;border:1px solid;cursor:pointer;transition:transform .12s ease,box-shadow .15s ease,background-color .15s ease !important; }
    .chip:hover{ transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.1) !important; }
    .chip:active{ transform:scale(.94) !important; }
    @keyframes pulse-add{ 0%{ transform:scale(1) } 40%{ transform:scale(1.15) } 100%{ transform:scale(1) } }
    .chip.pulsed{ animation:pulse-add .35s ease; }
    .chip.c0{ background:#dbeafe;border-color:#93c5fd;color:#1d4ed8; }
    .chip.c1{ background:#dcfce7;border-color:#86efac;color:#15803d; }
    .chip.c2{ background:#f3e8ff;border-color:#c4b5fd;color:#6d28d9; }
    .chip.c3{ background:#fce7f3;border-color:#f9a8d4;color:#be185d; }
    .chip.c4{ background:#ffedd5;border-color:#fdba74;color:#c2410c; }
    .chip.c5{ background:#fef9c3;border-color:#fde047;color:#a16207; }
    .chip.c6{ background:#ccfbf1;border-color:#5eead4;color:#0f766e; }
    .chip.c7{ background:#ffe4e6;border-color:#fda4af;color:#be123c; }
    .hl{ display:inline-flex;position:relative;padding:2px 10px;border-radius:9999px;font-weight:700; }
    .hl::after{ content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:9999px;background:rgba(255,255,255,.7); }
    .hl.blue{ background:#dbeafe;color:#2563eb; }
    .hl.orange{ background:#ffedd5;color:#ea580c; }
    .hl.pink{ background:#fae8ff;color:#c026d3; }
    .hl.green{ background:#dcfce7;color:#16a34a; }
    .hl.yellow{ background:#fef9c3;color:#a16207; }
    .info-card{ width:100%;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(15,15,25,.03);overflow:hidden;border:1px solid #e8e8ef;font-size:13px; }
    .info-card > .info-illu{ min-height:0; }
    .info-card .p-5{ padding:16px; }
    .info-card h4{ font-size:15px; }
    .info-card .text-sm{ font-size:12.5px; }
    .info-card .leading-6{ line-height:1.45; }
    .info-card .leading-8{ line-height:1.9; }
    .info-card > .info-body{ flex:none; }
    @keyframes info-pop{ from{ opacity:0;transform:translateY(6px) scale(.98) } to{ opacity:1;transform:translateY(0) scale(1) } }
    .info-card{ animation:info-pop .18s ease; }
    .info-btn{ display:inline-flex;height:22px;width:22px;align-items:center;justify-content:center;border-radius:9999px;color:#9497a3;border:1px solid #dcdce4;cursor:pointer;flex:none;transition:background .15s,color .15s,border-color .15s; }
    .info-btn:hover{ background:#eef2ff;color:#003AB8;border-color:#c7d2fe; }
    .wave{ display:inline-flex;align-items:center;gap:3px;height:16px; }
    .wave span{ width:2.5px;border-radius:2px;background:currentColor;display:inline-block;animation:wave-bounce 1s ease-in-out infinite; }
    .wave span:nth-child(1){ height:35%;animation-delay:0s }
    .wave span:nth-child(2){ height:65%;animation-delay:.12s }
    .wave span:nth-child(3){ height:100%;animation-delay:.24s }
    .wave span:nth-child(4){ height:55%;animation-delay:.36s }
    .wave span:nth-child(5){ height:80%;animation-delay:.48s }
    @keyframes wave-bounce{ 0%,100%{ transform:scaleY(.35) } 50%{ transform:scaleY(1) } }
    .voice-avatar{ background:radial-gradient(circle at 35% 30%, #fed7aa, #f97316 70%); }
    .voice-ring{ position:absolute;inset:0;border-radius:9999px;border:2px solid rgba(249,115,22,.5);animation:voice-ring 1.8s ease-out infinite; }
    .voice-ring.d2{ animation-delay:.6s } .voice-ring.d3{ animation-delay:1.2s }
    @keyframes voice-ring{ 0%{ transform:scale(1);opacity:.7 } 100%{ transform:scale(1.7);opacity:0 } }
    .paused .voice-ring{ animation-play-state:paused;opacity:0 }
    .paused .wave span{ animation-play-state:paused }
    .vbtn{ display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s; }
    .chat-msg{ animation:info-pop .25s ease; }
  </style>
</head>
<body class="text-foreground">
  <div class="flex h-screen overflow-hidden bg-background text-foreground">
    <!-- Sidebar -->
    <aside class="flex w-64 shrink-0 flex-col border-r border-border bg-card">
      <div class="flex items-center justify-between px-5 py-4">
        <div class="flex items-center gap-2"><i data-lucide="users" class="h-6 w-6 text-[#003AB8]"></i><span class="text-xl font-bold text-[#003AB8]">instaview</span></div>
        <i data-lucide="panel-left-close" class="h-5 w-5 text-muted-foreground"></i>
      </div>
      <div class="border-t border-[hsl(240_6%_80%)]"></div>
      <div class="px-4 py-3">
        <p class="mb-1 text-xs text-muted-foreground">Aktuálna firma</p>
        <button class="flex w-full items-center justify-between rounded-md border border-border bg-card px-3 py-2 text-sm shadow-sm"><span class="flex items-center gap-2"><span class="flex h-6 w-6 items-center justify-center rounded bg-[#003AB8]/20 text-xs font-semibold text-[#003AB8]">TE</span>Testovanie 2</span><i data-lucide="chevrons-up-down" class="h-4 w-4 text-muted-foreground"></i></button>
      </div>
      <div class="border-t border-[hsl(240_6%_80%)]"></div>
      <div class="px-4 py-4">
        <div class="flex items-center justify-between rounded-lg border border-[#003AB8]/30 bg-[#003AB8]/10 px-3 py-2.5">
          <div class="flex items-center gap-2"><i data-lucide="sparkles" class="h-4 w-4 text-[#003AB8]"></i><div class="leading-tight"><p class="text-xs text-muted-foreground">AI kredity</p><p class="text-sm font-semibold">188.48</p></div></div>
          <span class="rounded-md bg-[#003AB8] px-2.5 py-0.5 text-xs font-semibold text-white">Kúpiť</span>
        </div>
      </div>
      <div class="border-t border-[hsl(240_6%_80%)]"></div>
      <nav class="flex-1 space-y-1 px-3 py-3" id="mainNav"></nav>
      <div class="border-t border-[hsl(240_6%_80%)]"></div>
      <div class="space-y-1 px-3 py-3" id="bottomNav"></div>
    </aside>

    <!-- Main -->
    <main class="flex flex-1 flex-col overflow-hidden">
      <!-- top bar -->
      <div class="flex items-center gap-3 border-b border-border bg-card px-6 py-3">
        <input id="agentName" placeholder="Názov agenta" class="w-64 rounded-md border border-border bg-card px-3 py-2 text-sm shadow-sm outline-none focus:border-[#003AB8] focus:ring-2 focus:ring-[#003AB8]/20" />
        <span class="rounded-md bg-muted px-3 py-1.5 text-sm font-medium text-muted-foreground">Telefón</span>
        <div class="ml-auto flex items-center gap-2">
          <button class="flex items-center gap-2 rounded-md border border-border bg-card px-4 py-2 text-sm font-medium shadow-sm hover:bg-muted"><i data-lucide="phone" class="h-4 w-4"></i> Vyskúšať</button>
          <button onclick="location.href='agents-preview.html'" class="rounded-md border border-border bg-card px-4 py-2 text-sm font-medium shadow-sm hover:bg-muted">Zrušiť</button>
          <button class="rounded-md bg-[#003AB8] px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#002a85]">Vytvoriť Agenta</button>
        </div>
      </div>

      <!-- tabs -->
      <div class="flex items-center gap-1 border-b border-border bg-card px-6 py-2" id="tabs"></div>

      <!-- editor split -->
      <div class="flex flex-1 overflow-hidden" id="view-scenar">
        <!-- canvas -->
        <div class="relative flex-1 overflow-hidden">
          <div id="canvas" class="canvas absolute inset-0 overflow-auto">
            <div class="flex items-center gap-1 rounded-lg border border-border bg-card p-1 shadow-sm" style="position:absolute;top:16px;left:16px;z-index:5">
              <button class="zoombtn" title="Späť"><i data-lucide="undo-2" class="h-4 w-4"></i></button>
              <span class="h-5 w-px bg-border"></span>
              <button class="zoombtn" title="Znovu"><i data-lucide="redo-2" class="h-4 w-4"></i></button>
            </div>
            <div id="flowInner" style="min-width:700px;min-height:640px;position:relative">
              <div id="flow" class="flex flex-col items-center" style="padding:56px 0"></div>
            </div>
          </div>
          <div class="flex flex-col rounded-lg border border-border bg-card shadow-sm" style="position:absolute;bottom:16px;left:16px;z-index:5">
            <button class="zoombtn" id="zIn"><i data-lucide="plus" class="h-4 w-4"></i></button>
            <button class="zoombtn border-t border-border" id="zOut"><i data-lucide="minus" class="h-4 w-4"></i></button>
            <button class="zoombtn border-t border-border" id="zFit"><i data-lucide="maximize" class="h-4 w-4"></i></button>
          </div>
        </div>

        <!-- right panel -->
        <aside class="w-[360px] shrink-0 overflow-y-auto border-l border-border bg-card px-5 py-6" id="rightPanel"></aside>
      </div>

      <!-- other tabs (Kontext, Hlas, …) -->
      <div class="hidden flex-1 overflow-y-auto" id="view-other"></div>
    </main>
  </div>

  <script>
    const navItems = [
      { label:"Prehľad", icon:"layout-grid", href:"dashboard-preview.html" },
      { label:"Pohovory", icon:"message-square" },
      { label:"Pracovné pozície", icon:"briefcase" },
      { label:"Kandidáti", icon:"clipboard-list" },
      { label:"Vyhľadávanie talentov", icon:"search", href:"instaview-sourcing-agent.html" },
      { label:"Agenti", icon:"bot", href:"agents-preview.html", active:true },
      { label:"Design agent", icon:"sparkles", href:"design-agent.html" },
    ];
    const bottomNav = [
      { label:"Fakturácia a spotreba", icon:"credit-card" },
      { label:"Nastavenia", icon:"settings" },
      { label:"Podpora", icon:"help-circle" },
    ];
    document.getElementById("mainNav").innerHTML = navItems.map(i => {
      const cls = `flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors ${i.active ? "bg-[#003AB8]/15 text-[#003AB8]" : "text-foreground hover:bg-muted"}`;
      const inner = `<i data-lucide="${i.icon}" class="h-4 w-4"></i>${i.label}`;
      return i.href ? `<a href="${i.href}" class="${cls}">${inner}</a>` : `<button class="${cls}">${inner}</button>`;
    }).join("");
    document.getElementById("bottomNav").innerHTML = bottomNav.map(i => `<button class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-muted hover:text-foreground"><i data-lucide="${i.icon}" class="h-4 w-4"></i>${i.label}</button>`).join("");

    // ---------- tabs ----------
    const tabs = [
      { id:"scenar", label:"Scénár", icon:"git-branch" },
      { id:"kontext", label:"Kontext", icon:"brain" },
      { id:"analytika", label:"Vyhodnotenie hovoru", icon:"bar-chart-3" },
    ];
    const tabsRight = [
      { id:"hlas", label:"Hlas", icon:"volume-2" },
      { id:"nastavenia", label:"Nastavenia", icon:"settings" },
      { id:"integracie", label:"Integrácie", icon:"blocks" },
    ];
    let activeTab = "scenar";
    function renderTabs(){
      const btn = (t) => `<button onclick="setTab('${t.id}')" class="flex items-center gap-2 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${activeTab===t.id ? 'bg-foreground text-white' : 'text-muted-foreground hover:bg-muted'}"><i data-lucide="${t.icon}" class="h-4 w-4"></i>${t.label}</button>`;
      document.getElementById("tabs").innerHTML =
        tabs.map(btn).join("") + `<div class="ml-auto flex items-center gap-1">` + tabsRight.map(btn).join("") + `</div>`;
      lucide.createIcons();
    }
    function setTab(id){
      activeTab = id; renderTabs();
      const isScenar = id === "scenar";
      document.getElementById("view-scenar").classList.toggle("hidden", !isScenar);
      const other = document.getElementById("view-other");
      other.classList.toggle("hidden", isScenar);
      if (!isScenar) other.innerHTML = tabContent(id);
      lucide.createIcons();
    }
    function tabContent(id){
      if (id === "kontext") return kontextHTML();
      if (id === "hlas") return hlasHTML();
      if (id === "analytika") return analytikaHTML();
      if (id === "nastavenia") return nastaveniaHTML();
      if (id === "integracie") return integracieHTML();
      return `<div class="mx-auto max-w-3xl px-8 py-14 text-center text-muted-foreground"><p class="text-lg font-semibold text-foreground">${id}</p><p class="mt-2 text-sm">Táto sekcia je pripravená na doplnenie.</p></div>`;
    }
    function sectionHeader(icon, title, desc, variant){
      const big = variant === true || variant === "big";
      const small = variant === "small";
      const iconBox = big ? "h-11 w-11 rounded-xl" : small ? "h-8 w-8 rounded-md" : "h-9 w-9 rounded-lg";
      const iconSz = big ? "h-6 w-6" : small ? "h-4 w-4" : "h-5 w-5";
      const titleCls = big ? "text-lg font-bold" : small ? "text-sm font-bold" : "text-base font-bold";
      const descCls = big ? "text-sm text-muted-foreground" : small ? "text-xs text-muted-foreground" : "text-sm text-muted-foreground";
      return `<div class="flex items-start gap-3">
        <span class="flex ${iconBox} items-center justify-center bg-[#003AB8]/10 text-[#003AB8]"><i data-lucide="${icon}" class="${iconSz}"></i></span>
        <div><h3 class="${titleCls}">${title}</h3><p class="${descCls}">${desc}</p></div>
      </div>`;
    }
    function saveRow(title, desc, on=true){
      return `<div class="flex items-center justify-between gap-6">
        <div><p class="text-sm font-semibold">${title}</p><p class="text-xs text-muted-foreground">${desc}</p></div>
        <span class="switch"><input type="checkbox" ${on?'checked':''}><span class="track"></span><span class="thumb"></span></span>
      </div>`;
    }
    function comingSoonRow(title, desc){
      return `<div class="flex items-center justify-between rounded-md border border-dashed border-border px-4 py-4 opacity-70">
        <div><p class="text-sm font-semibold">${title}</p><p class="text-xs text-muted-foreground">${desc}</p></div>
        <span class="flex items-center gap-1 rounded-md bg-muted px-2.5 py-1 text-xs font-medium text-muted-foreground"><i data-lucide="lock" class="h-3 w-3"></i> Čoskoro</span>
      </div>`;
    }

    // ---------- analytika (Vyhodnotenie hovoru) state ----------
    const FIELD_TYPES = ["Text","Číslo","Áno/Nie","Výber (jedna z možností)"];
    const FREQUENT_FIELDS = [
      { group:"Kontakt a všeobecné", items:["Celé meno","E-mail","Telefónne číslo","Spoločnosť","Názov pozície","Lokalita","Preferovaný jazyk","Sentiment"] },
      { group:"Nábor / HR",          items:["Roky praxe","Najvyššie vzdelanie","Kľúčové zručnosti","Výpovedná lehota","Platové očakávanie","Ochota sťahovať sa"] },
      { group:"Predaj a oslovenie",  items:["Rozpočet","Časový plán rozhodnutia","Osoba s rozhodovacou právomocou","Úroveň záujmu","Aktuálne riešenie","Veľkosť spoločnosti","Problémy (pain points)"] },

    function totalScoreWeight(sq){
      let total = 0;
      analytics.criteria.forEach(c => { if (c.active === false) return; if ((c.name||"").trim() || (c.ideal||"").trim()) total += Number(c.weight)||1; });
      analytics.fields.forEach(f => { if ((f.ideal||"").trim()) total += 1; });
      analytics.enabledQ.forEach(k => { total += Number(qMetaFor(k).weight)||1; });
      return total || 1;
    }
    function scoreState(sq){
      const scored = [];
      analytics.criteria.forEach(c => { if (c.active === false) return; if ((c.name||"").trim() || (c.ideal||"").trim()) scored.push({ label:c.name||"(bez názvu)", weight:Number(c.weight)||1, priority:c.priority||"Preferred" }); });
      analytics.fields.forEach(f => { if ((f.ideal||"").trim()) scored.push({ label:f.name||"(bez názvu)", weight:1, priority:"Preferred" }); });
      analytics.enabledQ.forEach(k => {
        const m = qMetaFor(k);
        const src = (sq||[]).find(x => x.key === k);
        const label = m.qOverride ?? src?.q ?? "otázka scenára";
        scored.push({ label, weight:Number(m.weight)||1, priority:m.priority||"Preferred" });
      });
      if (scored.length === 0) return { empty:true, segments:[] };
      const totalW = scored.reduce((s,x) => s + x.weight, 0) || 1;
      const segments = scored.map(s => ({ ...s, pct: Math.round((s.weight / totalW) * 100) }));
      return { empty:false, segments };
    }

    function selectVoice(name){ selectedVoice = name; setTab("hlas"); }
    function kontextHTML(){
      return `<div class="max-w-6xl px-10 py-8">
        <div class="sec-card p-7">
          <div class="flex items-start gap-3">
            <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#003AB8]/10 text-[#003AB8]"><i data-lucide="user-round" class="h-5 w-5"></i></span>

            <label class="block text-sm font-semibold">Rola / systémový prompt</label>

            <div><h3 class="text-base font-bold">Kontext a znalosti</h3><p class="text-sm text-muted-foreground">Poskytnite kontext, pokyny a externé dokumenty, na ktoré sa agent môže odkazovať.</p></div>

          </div>
          <label class="mt-5 flex items-center justify-between">
            <span><span class="block text-sm font-semibold">Zahrnúť kontext spoločnosti</span><span class="block text-xs text-muted-foreground">Vloží popis vašej spoločnosti (z nastavení) do kontextu agenta.</span></span>

            <span class="flex items-center gap-1 rounded-md bg-muted px-2.5 py-1 text-xs font-medium text-muted-foreground"><i data-lucide="lock" class="h-3 w-3"></i> Čoskoro</span>
          </div>
          <div class="mt-3 flex items-center justify-between rounded-lg border border-dashed border-border px-4 py-4 opacity-70">
            <div><p class="text-sm font-semibold">Osobný kontext (CV / zdroj kontaktu)</p><p class="text-xs text-muted-foreground">Umožní AI odkazovať sa na nahrané CV kontaktu alebo zdroj.</p></div>
            <span class="flex items-center gap-1 rounded-md bg-muted px-2.5 py-1 text-xs font-medium text-muted-foreground"><i data-lucide="lock" class="h-3 w-3"></i> Čoskoro</span>
          </div>
        </div>

        <div class="mt-5 sec-card p-7">
          <div class="flex items-start gap-3">
            <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#003AB8]/10 text-[#003AB8]"><i data-lucide="shield-check" class="h-5 w-5"></i></span>

          </div>
          <button class="mt-4 flex items-center gap-2 rounded-md border border-border bg-card px-4 py-2 text-sm font-medium shadow-sm hover:bg-muted"><i data-lucide="plus" class="h-4 w-4"></i> Pridať pravidlo</button>
        </div>
      </div>`;
    }

    // ---------- flow ----------
    const NODE = {
      intro:     { title:"Úvodná správa", icon:"flag", color:"#16a34a", bg:"#e8f7ee", sub:"Ahoj {{contact.first_name}}, tu…" },
      topic:     { title:"Téma / Agenda", icon:"message-square", color:"#003AB8", bg:"rgba(0,58,184,.1)", sub:"Čo by tu mal agent…" },
      questions: { title:"Sada otázok", icon:"help-circle", color:"#7c3aed", bg:"rgba(124,58,237,.12)", sub:"1 otázka" },
      branch:    { title:"Podmienená trasa", icon:"git-branch", color:"#d97706", bg:"#fef3c7", sub:"Yes · No" },
      end:       { title:"Záverečná správa", icon:"flag", color:"#db2777", bg:"#fce7f3", sub:"Ďakujem za váš čas, {{contact.firs…" },
    };
    const CONTACT_VARS = ["Meno","Priezvisko","E-mail","Telefón","Názov firmy","Meno agenta"];
    let flow = [ {t:"intro",id:"n1"}, {t:"topic",id:"n2"}, {t:"end",id:"n3"} ];
    let selNode = null;
    let uid = 4;
    function nodeSub(n){
      const d = NODE[n.t];
      if (n.t === "questions") { const c = (n.questions||[{}]).length; return c + " " + (c===1?"otázka":(c<5?"otázky":"otázok")); }
      if (n.t === "branch") return (n.routes||[]).map(r => r.name).join(" · ");
      return d.sub;
    }
    function renderFlow(){
      const el = document.getElementById("flow");
      let html = "";
      flow.forEach((n, i) => {
        const d = NODE[n.t];
        html += `<div class="fnode ${selNode===n.id?'sel':''}" onclick="selectNode('${n.id}')">
          <span class="ic" style="background:${d.bg};color:${d.color}"><i data-lucide="${d.icon}" class="h-4 w-4"></i></span>
          <span style="min-width:0"><span class="tt">${d.title}</span><span class="sub">${nodeSub(n)}</span></span>
        </div>`;
        if (n.t === "branch") {
          html += `<div class="fconn"></div>
          <div class="broutes">
            ${(n.routes||[]).map(r => `
              <div class="broute">
                <div class="brlbl">${r.name}</div>
                <div class="fconn" style="height:22px"></div>
                <button class="braddstep" onclick="event.stopPropagation();openAddPop(event, ${i}, '${r.name}')">+ Pridať krok do „${r.name}"</button>
                <div class="fconn" style="height:22px"><button class="add" onclick="event.stopPropagation();openAddPop(event, ${i}, '${r.name}')"><i data-lucide="plus" class="h-4 w-4"></i></button></div>
              </div>`).join("")}
          </div>`;
        }
        if (i < flow.length - 1) html += `<div class="fconn"><button class="add" onclick="event.stopPropagation();openAddPop(event, ${i})"><i data-lucide="plus" class="h-4 w-4"></i></button></div>`;
      });
      el.innerHTML = html;
      lucide.createIcons();
    }
    function selectNode(id){ selNode = id; closeAddPop(); renderFlow(); renderPanel(); }

    // ---------- add-step popover ----------
    let addPop = null;
    const ADD_OPTIONS = [
      { t:"topic",     title:"Téma / Agenda",    desc:"Definujte témy, scenáre alebo obrazovky, ktorými agent kontakt prevedie.", icon:"message-square", color:"#003AB8", bg:"rgba(0,58,184,.1)" },
      { t:"questions", title:"Sada otázok",      desc:"Pýtajte sa a vyhodnocujte odpovede. Pridané ideálne odpovede sa započítavajú do skóre zhody.", icon:"help-circle", color:"#7c3aed", bg:"rgba(124,58,237,.12)" },
      { t:"branch",    title:"Podmienená trasa", desc:"Vetvte cestu dynamicky na základe zámeru volajúceho alebo používateľského vstupu.", icon:"git-branch",  color:"#d97706", bg:"#fef3c7" },
    ];
    function openAddPop(ev, afterIdx, route){
      closeAddPop();
      const pop = document.createElement("div");
      pop.className = "addpop";
      pop.innerHTML = `
        <div class="addpop-h"><span>Pridať krok${route?` do „${route}"`:""}</span><button onclick="closeAddPop()" style="border:0;background:transparent;color:#8a8a93;cursor:pointer"><i data-lucide="x" class="h-4 w-4"></i></button></div>
        ${ADD_OPTIONS.map(o => `
          <div class="opt" onclick="pickAdd(${afterIdx}, '${o.t}')">
            <span class="ic" style="background:${o.bg};color:${o.color}"><i data-lucide="${o.icon}" class="h-4 w-4"></i></span>
            <div><div class="tt">${o.title}</div><div class="ds">${o.desc}</div></div>
          </div>`).join("")}`;
      const canvas = document.getElementById("canvas");
      canvas.appendChild(pop);
      // position to the right of the clicked +
      const rect = ev.currentTarget.getBoundingClientRect();
      const cRect = canvas.getBoundingClientRect();
      pop.style.left = (rect.right - cRect.left + canvas.scrollLeft + 12) + "px";
      pop.style.top  = (rect.top   - cRect.top  + canvas.scrollTop  - 8)  + "px";
      addPop = pop;
      lucide.createIcons();
    }
    function closeAddPop(){ if (addPop) { addPop.remove(); addPop = null; } }
    function pickAdd(afterIdx, t){
      const node = { t, id:"n"+(uid++) };
      if (t === "questions") node.questions = [{ q:"", ideal:"" }];
      if (t === "branch") node.routes = [
        { name:"Yes", condition:"the contact agrees / responds positively" },
        { name:"No",  condition:"the contact declines / responds negatively" },
      ];
      flow.splice(afterIdx+1, 0, node);
      closeAddPop();
      selNode = node.id;
      renderFlow();
      renderPanel();
    }

    // ---------- right panel ----------
    function contactVarsHTML(){
      return `
        <p class="mb-2 text-xs font-semibold text-muted-foreground">Vložiť premennú kontaktu</p>

    function panelHeader(d, subtitle){
      return `<div class="mb-5 flex items-center gap-3">

    }
    function panelBranch(n, d){
      const rs = n.routes || [];
      return `
        ${panelHeader(d, "Podmienená trasa")}
        ${contactVarsHTML()}
        ${rs.map((r,i) => `
          <div class="mb-5">
            <p class="mb-2 flex items-center gap-1.5 text-xs font-semibold text-[#d97706]"><i data-lucide="git-branch" class="h-3.5 w-3.5"></i> Trasa ${i+1}</p>
            <label class="mb-1.5 block text-xs font-semibold text-muted-foreground">Názov trasy</label>

          </div>`).join("")}
        <label class="mb-1.5 mt-2 block text-xs font-semibold text-muted-foreground">Názov kroku (nepovinné)</label>
        <input class="mb-6 w-full rounded-md border border-border bg-card px-3 py-2 text-sm outline-none focus:border-[#003AB8] focus:ring-2 focus:ring-[#003AB8]/20" placeholder="napr. Overiť rozpočet" value="${n.name||""}" oninput="updateNodeName('${n.id}', this.value)">

    function panelGeneric(n, d){
      return `
        ${panelHeader(d, "Upravte tento krok scenára")}

        <button class="flex items-center gap-1.5 text-sm font-medium text-red-500" onclick="deleteNode('${n.id}')"><i data-lucide="trash-2" class="h-4 w-4"></i> Odstrániť krok</button>`;

    function renderPanel(){
      const p = document.getElementById("rightPanel");
      if (selNode) {

      p.innerHTML = `
        <div class="text-center">
          <span class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-[#003AB8]/10 text-[#003AB8]"><i data-lucide="compass" class="h-6 w-6"></i></span>
          <h3 class="text-base font-bold">Editor scénára</h3>
          <p class="mx-auto mt-1 max-w-[260px] text-sm text-muted-foreground">Vyberte krok na scenári, ktorý chcete upraviť, alebo použite „+" pre rozšírenie stromu konverzácie.</p>

          <div class="bstep"><span class="ic" style="background:rgba(124,58,237,.12);color:#7c3aed"><i data-lucide="help-circle" class="h-4 w-4"></i></span><div><p class="text-sm font-semibold">Sada otázok</p><p class="text-xs text-muted-foreground">Pýtajte sa a vyhodnocujte odpovede. Pridané ideálne odpovede sa započítavajú do skóre zhody.</p></div></div>
          <div class="bstep"><span class="ic" style="background:#fef3c7;color:#d97706"><i data-lucide="git-branch" class="h-4 w-4"></i></span><div><p class="text-sm font-semibold">Podmienená trasa</p><p class="text-xs text-muted-foreground">Vetvte cestu dynamicky na základe zámeru volajúceho alebo používateľského vstupu.</p></div></div>
        </div>
        <p class="mb-2 mt-7 text-xs font-bold tracking-wider text-muted-foreground">PRAVIDLÁ A LIMITY</p>

          <li class="flex gap-2"><span class="text-[#003AB8]">•</span> Maximálna hĺbka vetvenia je obmedzená na 3 úrovne.</li>
          <li class="flex gap-2"><span class="text-[#003AB8]">•</span> Nastavením ideálnych odpovedí v krokoch otázok nakonfigurujete metriky hodnotenia.</li>
        </ul>
        <p class="mb-2 mt-7 text-xs font-bold tracking-wider text-muted-foreground">SKRATKY</p>
        <div class="flex items-center gap-4 text-xs text-muted-foreground">
          <span><kbd class="rounded border border-border bg-muted px-1.5 py-0.5 font-mono">Ctrl</kbd> + <kbd class="rounded border border-border bg-muted px-1.5 py-0.5 font-mono">Z</kbd> Späť</span>
          <span><kbd class="rounded border border-border bg-muted px-1.5 py-0.5 font-mono">Ctrl</kbd> + <kbd class="rounded border border-border bg-muted px-1.5 py-0.5 font-mono">Y</kbd> Znovu</span>
        </div>`;
      lucide.createIcons();
    }
    function deleteNode(id){ if (flow.length <= 2) return; flow = flow.filter(x => x.id !== id); selNode = null; renderFlow(); renderPanel(); }

    // node data mutations
    function updateNodeName(id, v){ const n = flow.find(x => x.id === id); if (n) n.name = v; }
    function updateQuestion(id, i, k, v){ const n = flow.find(x => x.id === id); if (!n?.questions?.[i]) return; n.questions[i][k] = v; }
    function addQuestion(id){ const n = flow.find(x => x.id === id); if (!n) return; (n.questions ||= []).push({ q:"", ideal:"" }); renderFlow(); renderPanel(); }
    function updateRoute(id, i, k, v){ const n = flow.find(x => x.id === id); if (!n?.routes?.[i]) return; n.routes[i][k] = v; if (k === "name") renderFlow(); }

    // deselect on canvas background click
    document.getElementById("canvas").addEventListener("click", (e) => {
      if (e.target.closest(".fnode") || e.target.closest(".addpop") || e.target.closest(".braddstep") || e.target.closest(".add")) return;
      closeAddPop();
      selNode = null; renderFlow(); renderPanel();
    });

    // zoom
    let zoom = 1;
    const flowInner = document.getElementById("flowInner");
    const applyZoom = () => { flowInner.style.transformOrigin = "top center"; flowInner.style.transform = `scale(${zoom})`; };
    document.getElementById("zIn").onclick = () => { zoom = Math.min(1.6, zoom + 0.1); applyZoom(); };
    document.getElementById("zOut").onclick = () => { zoom = Math.max(0.5, zoom - 0.1); applyZoom(); };
    document.getElementById("zFit").onclick = () => { zoom = 1; applyZoom(); };

    renderTabs(); renderFlow(); renderPanel();
    lucide.createIcons();
  </script>
</body>
</html>
